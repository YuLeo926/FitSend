name: Build source-pinned Windows FFmpeg

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/ffmpeg/**
      - .github/workflows/ffmpeg-windows.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm pkg-config cmake meson ninja-build curl unzip ca-certificates
      - name: Build binaries and matching source package
        run: bash scripts/ffmpeg/build-windows.sh "$RUNNER_TEMP/fitsend-ffmpeg"
      - name: Upload binaries and source materials together
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fitsend-ffmpeg-windows-x64
          path: ${{ runner.temp }}/fitsend-ffmpeg/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-build-diagnostics
          path: |
            ${{ runner.temp }}/fitsend-ffmpeg/materials
            ${{ runner.temp }}/fitsend-ffmpeg/src/ffmpeg/ffbuild/config.log
          if-no-files-found: ignore
          retention-days: 14
