[package]
name = "fitsend"
version = "0.3.0"
description = "Make local files fit their destination"
authors = ["FitSend contributors"]
edition = "2021"

[workspace]
members = ["core"]
resolver = "2"

[lib]
name = "fitsend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fitsend-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
