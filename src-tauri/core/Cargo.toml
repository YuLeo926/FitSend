[package]
name = "fitsend-core"
version = "0.1.3"
description = "Local media analysis and size-constrained processing for FitSend"
edition = "2021"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
